name: Progressive results

on:
  schedule:
    # Update after each block of races. The evening window runs to 23:40 so a
    # late Valparaiso or French meeting settles the same night instead of
    # waiting for the midnight run. The early window settles the US races that
    # finish after midnight UTC.
    - cron: "*/20 0-3,12-23 * * *"
  push:
    # GitHub's scheduler can hold a twenty-minute cron for hours, so a new card
    # or a settled results file starts a run straight away instead. The job
    # skips its own commit below, which is what stops the loop.
    branches: [main]
    paths:
      - "data/cards/**"
      - "data/results/**"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  results:
    # The run's own commit lands in data/results and would trigger it again for
    # ever. Its message is the marker, so the guard and the commit message below
    # have to keep matching.
    if: >-
      github.event_name != 'push' ||
      !contains(github.event.head_commit.message, 'Live results')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # This job writes and commits the page too: the Hong Kong settle scores
      # its picks with the page's own scorer under node. Pinned to the version
      # the checks job renders with, so the committed page validates there.
      - uses: actions/setup-node@v4
        with:
          node-version: "26.13.0"
      - name: Install tools
        run: python3 -m pip install -r requirements.txt
      - name: Settle Hong Kong results
        # Hong Kong runs first, before the page is written, so a published page
        # cannot carry a HK ledger that lags the official result. The HKJC
        # gateway only serves the current meeting, so the tool settles the
        # current UTC day and refuses any other date.
        run: python3 tooling/settle_hk.py
      - name: Settle France results
        # PMU publishes the definitive arrival beside the card. The pick comes
        # from the pre-race card filed under data/cards, never a re-score.
        run: python3 tooling/settle_france.py
      - name: Settle Chile results
        # Same PMU programme as France. Chile carries no prices, so its picks
        # are scored without the market factor; the page says so.
        run: python3 tooling/settle_chile.py
      - name: Add completed races
        run: |
          day=$(date -u +%F)
          if [ "$(date -u +%H)" -lt 12 ]; then
            day=$(date -u -d 'yesterday' +%F)
          fi
          python3 tooling/settle_today.py "$day" --progressive
      - name: Audit Hong Kong factors
        # Runs over every filed snapshot, so the report is always the audit of
        # the whole archive and refreshes itself as meetings accumulate. A
        # report failing must never hold back the results commit or the page.
        continue-on-error: true
        run: python3 tooling/audit_hk.py --out data/hk_audit/latest.txt
      - name: Summarise ledger times
        # Runs even after a red feed failure: the summary should say how fresh
        # the UK and Irish ledgers are, not hide the partial run.
        if: always()
        run: python3 tooling/ledger_summary.py
      - name: Commit results
        id: commit
        # A failed US fetch ends the run red, but it must not strand the day's
        # settled races: the alarm is the red run, not an empty ledger.
        if: always()
        run: |
          git config user.name "racing-sheet-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/results data/results_hk data/results_fr data/results_cl data/hk_audit index.html dist/public/index.html
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No new settled races"
          else
            git commit -m "Live results $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/configure-pages@v5
        if: steps.commit.outputs.changed == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.commit.outputs.changed == 'true'
        with:
          path: dist/public
      - name: Wait for the Pages artifact
        if: steps.commit.outputs.changed == 'true'
        run: sleep 15
      - id: deployment
        if: steps.commit.outputs.changed == 'true'
        uses: actions/deploy-pages@v4
