name: Refresh data

on:
  schedule:
    # Cards in the morning, prices before racing, results after the last race (UTC).
    - cron: "10 8 * * *"
    - cron: "10 12 * * *"
    - cron: "10 21 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tools
        run: python3 -m pip install -r requirements.txt
      - name: Refresh cards, results and page
        run: python3 tooling/refresh.py
      - name: Measure country coverage
        # Probes every jurisdiction from the runner that actually builds the
        # page. A probe failing must not hold back the refresh or its commit.
        continue-on-error: true
        run: python3 tooling/audit_coverage.py --inject
      - name: Settle today's results after racing
        run: python3 tooling/settle_today.py
      - name: Commit what changed
        run: |
          git config user.name "racing-sheet-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "Refresh $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/public
      - id: deployment
        uses: actions/deploy-pages@v4
