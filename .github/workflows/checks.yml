name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The render scores each card by running the page's own scorer under node,
      # and those numbers go straight into the screen panels. Pinned to the
      # version the committed page was built with, so a change of the runner's
      # default node cannot move a figure and turn the page diff into noise.
      - uses: actions/setup-node@v4
        with:
          node-version: "26.13.0"
      - name: Install dependencies
        run: python3 -m pip install -r requirements.txt
      # The screen panels are derived from the stored re-score, so a data-only
      # change leaves the committed page behind until it is rendered. Render it
      # the way a local run does, before the suite compares the two.
      #
      # The render overwrites the page, so the committed copies are kept first:
      # comparing afterwards has to be against what was pushed, not against what
      # CI just wrote, or the comparison could never fail. A push that changed
      # data without rebuilding fails here, on the diff, instead of passing on a
      # page CI rendered for itself.
      - name: Rebuild the page from stored data
        run: |
          mkdir -p "$RUNNER_TEMP/committed/dist/public"
          cp index.html "$RUNNER_TEMP/committed/index.html"
          cp dist/public/index.html "$RUNNER_TEMP/committed/dist/public/index.html"
          python3 tooling/refresh.py --data-only
          diff "$RUNNER_TEMP/committed/index.html" index.html
          diff "$RUNNER_TEMP/committed/dist/public/index.html" dist/public/index.html
      - name: Fixture tests
        run: python3 tooling/test_checks.py
      - name: Factor documentation
        run: python3 tooling/check_factor_docs.py
